[[task]]
id = "investigate-attach-switch-lag-and-inter-turn-latency"
title = "Investigate attach-switch lag and inter-turn latency"
description = """
FINDING (2026-08-04). Both symptoms have the same root cause: every read of a session's
"last context usage" and of its display history re-fetches and re-parses the WHOLE transcript
JSONL from the target host over SSH.

1. Attach switching is NOT a server round trip for the state change. focusKnownSession
   (WebAppControllerMessages.kt:38 / VoiceControllerMessages.kt:113) sets attached id/name/agent
   locally and immediately; the `attach` frame it then sends is silent:true. So the switch itself
   is local, as expected. What the user perceives as lag is the two things that follow:
     - `session.requestFreshHistory` -> server `history` -> serveHistory (ops_history.go:22) calls
       driver.ReadDisplayHistory UNCONDITIONALLY, even for the bodies-free `unchanged` fast path.
       That reads and JSON-parses the entire transcript chain.
     - the server's `attached` reply (ops_session.go:145/175) calls driver.LastContextUsage, which
       scans the whole transcript file just to pull one number.

2. Inter-turn dead time: turns.go:171 calls LastContextUsage at the END of every turn, in the
   critical path, right before the final `output` frame is emitted. The transcript has just grown,
   so the (size, mtime) parse cache is guaranteed cold — every turn pays a full re-read.

Cost of one such read, for a remote (SSH) session, per transcript in the chain:
     findByID  -> one SSH exec channel (`ls -1d ...`)
     stat      -> a second SSH exec channel
     open      -> a third, `cat` of the ENTIRE file into memory
   Measured on this host: ~/.claude/projects is 897 MB; the largest single transcripts are 26 MB /
   20 MB / 21 MB. The 26 MB file is only 475 lines (huge tool-result lines). Parsing it with the
   same per-line json.Unmarshal claudeFS uses costs ~175 ms warm and local; over SSH add the full
   26 MB transfer. And gateway handlers are dispatched SERIALLY off one inbound loop
   (gateway.go:494), so this blocks every other request on the connection.

REDUNDANT WORK, in order of payoff:
   a. lastUsageInFile (transcript.go:340) scans forward through the whole file to find the LAST
      usage-bearing assistant line. It only ever needs the tail.
   b. The parse cache is all-or-nothing on (size, mtime), but these JSONL files are APPEND-ONLY.
      Every turn invalidates the whole cached parse to append one turn's lines.
   c. findByID + stat + open are three separate SSH round trips for one file.
   d. serveHistory does the full read before checking have_hash, so the cache-validation fast path
      isn't a fast path on the server at all.

PROPOSED FIX, at the claudeFS seam (server/internal/session/claudefs.go) - not a band-aid at the
call sites:
   - Add a `tail(path, nbytes)` primitive alongside stat/open (local: ReadAt from the end; remote:
     `tail -c`). Reimplement lastContextUsage to scan backwards over a bounded tail, exactly the way
     cwdHeadBytes already bounds the cwd lookup at the head. This alone removes the per-turn cost in
     turns.go and most of the attach cost.
   - Make the transcript parse cache INCREMENTAL: key it on (path, mtime, size) as today, but on a
     size-only growth with the prefix unchanged, read just the appended byte range and extend the
     cached message slice. Append-only is the invariant that makes this correct, and it fixes
     history/digest as well as usage.
   - Collapse findByID+stat+open into one remote command per file (a single `stat`+`cat`, or resolve
     the path once and cache the id->path mapping per host - the mapping is stable).
   - In serveHistory, compute the digest via the cheap chainSig/DisplayDigest path first and answer
     `unchanged` before touching ReadDisplayHistory."""
status = "finished"
category = "refactor"
created = 2026-08-04
completed = 2026-08-04
tags = ["performance", "latency", "ssh", "investigation"]

[[task]]
id = "antigravity-agy-backend"
title = "Antigravity (`agy`) backend"
description = """
Added Google's Gemini-powered `agy` CLI as the
    fourth AI backend (`server/internal/agent/antigravity.go`), registered in `agent.Default()`.
    Driven non-interactively via `agy --prompt` (its only headless mode — verified live: no
    machine-readable stream, plain-prose stdout is the reply). Caller-supplied `--conversation`
    uuid (created then resumed, like Claude, so `SelfAssignsID` false — verified resume recalls
    prior context). agy ignores the process cwd, so a new `TurnSpec.Dir` threads the session
    directory into `--add-dir`. Per-target binaries `SPAWNER_SSH_AGY_BIN` / `SPAWNER_SANDBOX_AGY_BIN`.
    Gemini 3.x Pro/Flash model catalogue with spoken aliases. Its on-disk store isn't wired to a
    reader (keyed by an internal id we don't hold, no usage recorded), so it routes to a new
    `nullTranscript` reader — reply streams live, but no history replay/context/deletion. Unit tests
    for args + parser; full `go test ./...` green.
- [x] 2026-07-17 — **Antigravity reply paragraph reconstruction.** `agy --print` concatenates a
      turn's several assistant messages into one blank-line-less blob on stdout, so multi-message
      turns rendered as a single wall-of-text paragraph in the app. After each antigravity turn the
      driver now reads agy's on-disk `brain/<id>/…/transcript.jsonl`, pulls the ordered
      `PLANNER_RESPONSE` messages, and rejoins them with blank lines
      (`session/antigravity_transcript.go`, `reconstructAgyReply`). Since agy ignores our
      `--conversation` id (see below), the right transcript is found by content-matching the newest
      few brain transcripts against the stdout blob — which also guards the rewrite: only line breaks
      change, never wording, and it falls back to the stdout reply on any miss. Unit tests + full
      `go test ./...` green.
- [x] 2026-08-03 — **Follow-up: agy ignores `--conversation` → turns don't actually resume.** FIXED.
      Root cause pinned live: `agy --conversation` can only *resume* an id agy itself created, so our
      caller-minted uuid was rejected ("not found, ignoring") and every turn started a fresh
      conversation — no cross-turn memory. Antigravity is therefore a **`SelfAssignsID`** backend now:
      the first turn passes no `--conversation`, and since agy announces the new id nowhere in its
      output, `Turn` adopts the **brain-dir id** already recovered by `reconstructAgyReply` as the
      session id (the brain id *is* the conversation id — verified live: turn 1 stored a secret word,
      turn 2 with `--conversation <brain id>` recalled it). Later turns resume with it; re-adopted if
      it ever drifts. Docs (`architecture.md`, `config.md`, `README.md`) corrected; unit tests updated;
      full `go test ./... -count=1` green.
- [x] 2026-07-29 — **Follow-up: real antigravity history reader.** Done — `TranscriptAntigravity`
      now routes to `antigravityFS` (below), so reattach replays agy history. (It was never actually
      blocked on the `--conversation` resume bug: the brain-id capture foundation gave us the stable
      our-session → agy-brain mapping the reader needed, independent of whether agy resumes.)
  - [x] 2026-07-17 — **Foundation: capture the per-turn brain id (the missing mapping).** Since agy
        ignores our `--conversation` id and files every turn under a fresh internal brain id, we now
        build the mapping ourselves: `agyBrainScript` emits each transcript's path, `matchAgyParagraphs`
        returns the matched block's brain id, and `Driver.Turn` records it in turn order on the new
        `Session.AgyBrainIDs` field (deduped against the last, rides through clear/compress). Read path
        unchanged (still `nullTranscript`), so zero regression — this just starts recording the data the
        reader needs. Unit tests in `antigravity_transcript_test.go`. Needs live agy turns to confirm
        the ids populate on real hardware.
  - [x] 2026-07-29 — **Wired the `antigravityFS` reader over `AgyBrainIDs`.** Given a session's
        `AgyBrainIDs`, it reads each `brain/<id>/…/transcript.jsonl` and assembles `[]Message`
        (USER_INPUT → user turn, unwrapped from the `<USER_REQUEST>` envelope; PLANNER_RESPONSE steps →
        one joined reply, mirroring `reconstructAgyReply`). The interface seam was already solved:
        `currentHistoryIDs`/`transcriptReaderFor` route `AgyBrainIDs` + host to the reader (the
        backend-aware `HistoryIDs()` this item anticipated already existed). `deleteByIDs` is a no-op
        (brain dirs are agy's store, not ours to reap) and `lastContextUsage` returns nil (agy has no
        token counts). Durable brain-scoped row ids; `nullTranscript` removed; docs updated.
- [x] 2026-08-04 — **Rich agy turns via the JSON stream.** DONE — it turned out not to be gated on
      Google at all: `agy --output-format stream-json` already exists, just undocumented in
      `agy --help` (the binary's own flag table names `text, json, stream-json`). `parseAgyStream`
      replaces `parseAgyText` and reads the real event stream: the `init` event's conversation id
      (adopted as the session id, so a turn dying mid-stream stays resumable), `step_update` events
      for live tool breadcrumbs and per-message assistant text (`text_delta` chunks accumulate per
      `step_index` across the ACTIVE/DONE sightings), and the final `result` event for the
      authoritative reply, model-cycle count, and token usage. Since the reply now carries its own
      paragraph breaks and the id is announced rather than inferred, the entire reconstruction
      workaround was deleted (`reconstructAgyReply`, `matchAgyParagraphs`, the brain-listing shell
      script and its content matching); the conversation id IS the brain-dir name, so
      `Session.AgyBrainIDs` is recorded straight from the stream and the history reader is unchanged.
      Verified live: id in `init`, tool params (`view_file`→AbsolutePath, `write_to_file`→TargetFile),
      and a two-turn resume recalling context under the same id. Remaining agy limits are agy's own —
      it reports cache *reads* but no cache-write count (so no cache-warm indicator) and no
      context-window size (so no context-remaining badge). Docs updated; `go test ./... -count=1`
      green."""

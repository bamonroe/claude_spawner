[[task]]
id = "per-session-record-locking"
title = "Per-session record locking"
description = """
(1.0 quality pass, deferred item). The store hands out
shared `*session.Session` pointers; a running turn's goroutine mutates the record
(Started/PendingSeed/primes + Put) while another device's read loop can mutate it too
(kill-job, set_agent/model, rename). The one-writer invariant covers turn-vs-turn and
reconcile, but not turn-vs-ops or two devices. Wants a deliberate design (per-record
mutex or store-mediated mutation), not a drive-by — scoped out of the 2026-07-13
concurrency fixes below.
- **Scoped 2026-07-30 (design ready; NOT implemented — deliberately deferred: this can't be
  live-verified, and a lock-ordering slip would deadlock the production server on next deploy, a
  worse failure than the current rare race).** Findings:
  - **`Store` (`store.go:15`) protects only the two index maps** (`byName`/`byID`); every getter
    (`Get`/`GetByDir`/`GetBySessionID`/`GetByAnyID`/`List`) returns the shared `*Session` directly
    under `RLock` and then drops the lock — so record *fields* are unsynchronized once the pointer
    escapes. `Session` (`session.go:25`) has no mutex.
  - **`Store.flush` (`store.go:262`) marshals the shared pointers under only the map RLock** — a
    concurrent field write (esp. a slice append: `PriorIDs`/`History`/`AgyBrainIDs`/`Jobs`) is a
    real data race against `json.Marshal` and can corrupt/crash the marshal, independent of the
    two-writer problem.
  - **Mutation sites** (~20): turn goroutine — `driver_turn.go:75/90/107/108/127`,
    `turns.go:101/118/122/130` (startTurn), `turns.go:232-238` (startCompress rotation);
    read-loop ops — `ops_session.go:311-317` (doClear, *isBusy-guarded*),
    `ops_discover.go:158-175` (set_agent/model, *isBusy guards only the backend-switch branch, not
    the model-only `rec.Model=` write*), `ops_usage.go:164` (doSetModel, **unguarded**),
    `bgjobs.go:243` (doKillJob, **unguarded**), `dictate.go:37`; off-loop tickers —
    `bgjobs.go:95-127` (reconcileJobs, isBusy-guarded), `bgnotify.go:165` (isBusy-guarded);
    `store.Rename` (`store.go:244`) is the one store-mediated field write.
  - **The three genuinely-unguarded turn-vs-ops races:** `doSetModel`, `doKillJob`, and the
    model-only path of `set_agent`. (A blunt `isBusy` guard on these is the wrong fix — it would
    e.g. block killing a runaway bg job while a turn runs; that UX nuance is why this is not a
    drive-by.)
  - **Recommended fix (lowest-churn complete path):** embed a `sync.Mutex` in `Session`; wrap
    each mutation (multi-field rotations as one critical section); make `flush` **snapshot each
    record's fields under that record's lock, then marshal the snapshots outside the lock** (so
    encode holds no record lock and can't deadlock a `Mutate→Put→flush` chain). Full read-side
    race-freedom additionally needs the gateway's `sess.Name`/`sess.SessionID` routing reads to
    lock too — the large half — so land it as: (a) mutex + flush-snapshot + wrap writers
    (closes the corruption/two-writer races), verified with `go test -race ./...`; then (b)
    audit read-side field access. Do it in a session where a live deploy can validate.
- [x] 2026-08-03 — **Write side DONE (verified with `go test -race ./...`).** Shipped: a per-record
  `Session.mu` (lazy `*sync.Mutex`, so `&Session{...}` literals and json.Unmarshal stay valid) with
  three seams — `Mutate(fn)` (the only sanctioned field write; multi-field rotations are one critical
  section), `Read(fn)` (consistent multi-field read), and `Snapshot()` (deep copy under the lock,
  every slice cloned). `Store.flush` now marshals **snapshots**, never the live pointers, so encoding
  can no longer race a `PriorIDs`/`Jobs` append; `Store.Rename` writes `Name` through `Mutate`. All
  ~20 mutation sites wrapped (driver_turn, turns.go startTurn/compress, doClear, set_agent, doSetModel,
  doKillJob, reconcileJobs, bgnotify, dictate) — including the three previously unguarded
  turn-vs-ops races (doSetModel, doKillJob, the model-only set_agent path), now correct WITHOUT a
  blunt isBusy guard, so killing a runaway bg job mid-turn still works.
  Also removed `Session.ResolvedProfile`: per-launch scratch on a shared record let a turn and the
  job reconciler overwrite each other's profile (a real race the detector caught), so the resolved
  `*ExecProfile` is now an explicit parameter of `Executor.Start`/`SandboxLifecycle.Ensure`.
  Tests: `session/record_lock_test.go` — a reflection-driven test that fails if a NEW slice field
  isn't cloned by Snapshot (so the invariant can't rot), plus concurrent mutate-vs-flush and
  rename-vs-mutate races. `go build`, `go vet`, `go test ./... -count=1` and `go test -race ./...`
  all green — the race suite previously failed on a pre-existing Rename-vs-ProfileFor race, now fixed.
  Documented in `docs/architecture.md` ("Record locking").
- [x] 2026-08-03 — **Read side DONE (phase b).** Every read of a shared record now goes through the
  lock: pure readers snapshot at the boundary (`Driver.Turn` — which hands the snapshot to the
  executor — `ReadDisplayHistory`/`DisplayDigest`/`ArchiveSegment`/`DeleteSessionAll`/`RunOnTarget`,
  `msgAttached`, the session + discovered list builders, and the off-loop tickers `jobReconcileLoop`/
  `autoCompressLoop`/`reconcileJobs`); one-field reads use the new locked `recName`/`recID` helpers;
  `startTurn`/`startCompress`/`startJobNotify`/`bindJob` capture name + session_id once under the
  lock instead of re-reading a record they rotate; `Session.OwnsID`/`TranscriptIDs`/`HasPriorID` lock
  internally (with `…Locked` bodies for callers already holding it); `Store`'s scans and
  `Put`/`Delete` read record fields through `Read`/`Snapshot`. New regression test
  `TestStoreReadersRaceRotation` drives a rename + an id rotation against those readers (verified it
  fails under `-race` if a reader is unlocked again). `go build`, `go vet`, `go test ./... -count=1`
  and `go test -race ./...` all green. Documented in `docs/architecture.md` ("Record locking").
  Not live-verified on-device."""
status = "finished"
category = "feature"
created = "2026-07-01"
completed = 2026-08-03

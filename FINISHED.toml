[[task]]
id = "local-server-chat-cache-reconciliation-the-duplicate-rows-epic"
title = "Local↔server chat-cache reconciliation (the \"duplicate rows\" epic)"
description = """
The
    app keeps a local-centric message/session cache, but reconciliation between local state and
    what the server reports was scattered across several code paths with no single coherent apply
    point. Symptom: sporadic **duplicated message rows** displayed even though the transcript holds
    the message once; and mutating commands (`clear`/`compress`) did the work server-side but didn't
    tell the app to update its local rows. Landed as a coordinated two-worktree effort.

- **Root cause (from the code map):** duplicates came from reconciling by *exact trimmed text*
  instead of a *stable server identity*. Streamed replies appended one live CLAUDE row **per
  `output` chunk** (live rows carry `index = -1`), while server `history` stores the whole turn as
  **one** indexed row. The N partial live rows never text-matched the 1 full history row, so the
  text dedup couldn't collapse them → leftover duplicate bubbles. Separately, `clear`/`compress`
  rotate the session_id server-side but the app treated `context_reset` as a context-meter reset
  only, so the rotated session's now-stale rows were never dropped or refreshed.

- **Chosen mechanism (robust approach):** the rotated `session_id` rides on the **`context_reset`**
  itself, which is the single self-describing event for the rotation — the app re-keys to the new
  id and refreshes the cleared session's rows off it. We deliberately did **not** overload the
  `attached` (re-attach) message to mean "context rotated": a brief merge that took that route was
  reverted, because re-emitting `attached` drags the whole attach path along and couples clear/
  compress to any future change in attach behaviour. One event, one meaning.

- **App-side** (branch `app`, done): streamed chunks now collapse into one live bubble per turn
  (badged on turn close) instead of one row per chunk; live `output` and terminal notices route by
  the message's `name` not the visible key, with streamed-reply de-dupe state keyed per session;
  cached-log de-dupe is index-aware (`dedupeCachedLog`); session focus is local-first. And the
  rotated `session_id` is now consumed from `context_reset` itself (not the old `attached`
  re-emit): `ContextReset` carries `session_id`, and both `VoiceController` and `WebAppController`
  re-key the attached id to it, **drop** the cleared session's now-stale cached rows wholesale
  (`dropSessionCache` on Android; `logs`/`oldest`/`hasMore` on web — merging a small fresh page over
  rows carrying the old indexes was the duplicate-row source), and refetch fresh history. An empty
  `session_id` (old server) preserves the meter-reset-only behaviour.

- **Server-side** (branch `master`, done): `doClear` (`ops.go`) and the compress job (`jobs.go`)
  send a single `context_reset` carrying the rotated `session_id` (no `attached` re-emit);
  `docs/protocol.md` documents `-> context_reset + say`; clear/compress tests assert the
  `context_reset` carries a fresh id distinct from the retired one. `go test ./...` green.
  - [x] 2026-07-16 — **Refinement (Phase 1 sync, slice 3):** the session/chat reconcile
        decisions are hoisted into one shared `commonMain` `SessionSync` (sibling to
        `CatalogueSync`) so `VoiceController`/`WebAppController` can't drift — which session is
        focused, previous-session/swap bookkeeping, per-session digest freshness
        (`requestFreshHistory`/`recordSynced`/`noteServerTruth`), and the de-dup. The former
        text-based `dedupeCachedLog`/web `distinctBy` is replaced by the one `SessionSync.dedupe`
        keyed on server `index` (text fallback only for still-live rows). Platform side effects
        (StateFlow/settings wiring, Android's on-disk cache + timestamp merge + gap-fill, the
        web's in-memory index-sorted merge) stay behind the `SessionSync.Host` seam. No wire
        change; `:app:compileKotlinWasmJs` + `:app:clean :app:assembleDebug` both green.
    - [x] 2026-07-29 — Verified in the field: the sporadic duplicate rows / double-speak have not
          recurred in a long time of daily use on the live self-hosting Pixel 8a client (the bug was
          never deterministically reproducible even when active, so live-use absence is the strongest
          available signal). The layered fixes are all shipped — `SessionSync.dedupe`, the
          buffered-branch in-place badge in both controllers, and now durable-id-first collapse so a
          re-indexed history copy reconciles against a live row instead of duplicating.
    - [x] 2026-07-17 — **Transient duplicate reply bubble** — two identical fully-badged rows
          (same timestamp + token counts); detach/reattach collapsed it to one. **Root cause found
          (not the earlier guess):** both duplicate rows are LIVE rows (`index==-1`), not a
          live-vs-indexed miss — so `SessionSync.dedupe` (which only drops a live row against an
          *indexed* row) never applied, and only a full reattach's `onHistory` (the sole indexed-row
          producer) collapsed them. The second live row came from the turn-close `Output` handler's
          buffered-reply branch: it appended a fresh badged row whenever `streamedSessions` no longer
          held the name — which also fires when a duplicate closing `Output` arrives for a turn that
          *did* stream (backend double-emit, or `streamedSessions` cleared mid-turn by an interleaved
          Ask/Transcript/error). NOT Codex-specific — 2026-07-17 screenshots show it on the Opus
          session too. **Fix (both controllers):** before appending in the buffered branch, check if
          the last Claude row is a live row with the same trimmed text; if so, badge it in place
          instead of adding a second bubble (`VoiceController` Output handler + `WebAppController`
          mirror). Needs on-device confirmation the double bubble no longer appears.
    - [x] 2026-07-18 — **Duplicate hands-free VOICE (not the display row).** Same root-cause family
          as the double bubble, but on the TTS path: the *display* log dedupes correctly, yet
          hands-free still SPEAKS a reply twice. Cause: the display went through the shared
          `SessionSync.dedupe` reconciler while speech was decided imperatively in the Output handler
          off the transient `streamedSessions` flag + a single last-bubble text match — which the
          close's whole-reply text (≠ any single streamed chunk) and a doubled closing `Output`
          (backend double-emit, or the flag cleared mid-turn) both defeat, re-speaking the reply on
          top of the chunks that already voiced it. **Fix:** moved the speak decision into the same
          single source of truth — new `SessionSync.noteSpokenChunk` / `shouldSpeakClose` /
          `noteTurnStart` track the text the chunks actually voiced this turn plus the last close, so
          a streamed reply's close and any doubled close are not re-spoken, while a buffered reply
          (reconnect) and the summary-only final still are; the guard is per-turn (reset on the
          committed `transcript`) so an identical short reply next turn is still spoken. Covered by
          `SessionSyncSpeakTest`. Needs on-device confirmation the voice no longer doubles.
    - [x] 2026-07-18 — **Per-turn `turn` id on the wire — deterministic chunk/close linkage.**
          Root fix for the whole duplicate family: `output` frames carried no id, so the app could
          only link a close to its chunks by *text equality*, which the server doesn't guarantee
          (Antigravity restores paragraph breaks vs its flat streamed text, opencode `\\n\\n`-joins
          per-part chunks, Claude/Codex's close is only the *last* message of a multi-message turn)
          — and a buffered-final redelivery re-presents a close the app already handled. **Fix
          (server):** `startTurn` mints an opaque `turn` id stamped on every `output` frame of the
          turn (chunks + close, `msgOutput`); documented in `docs/protocol.md` (fieldsync-checked).
          **Fix (app):** `SessionSync` now keys the decisions on the id when present —
          `noteChunk`/`closeStreamed` link a close to its *shown* chunks for the display's
          bubble-vs-badge choice, `closeSeen` flags a redelivered close, and
          `noteSpokenChunk`/`shouldSpeakClose` gained the id so a streamed turn's close is
          suppressed *whatever its text* and a doubled/redelivered close speaks exactly once; the
          old whitespace-collapsed text comparison survives only as the fallback for a pre-turn-id
          server (`turn: ""`), so mixed app/server versions degrade gracefully in both directions.
          Covered by the id cases in `SessionSyncSpeakTest`. Server bounce pending to activate.
    - [x] 2026-07-18 — **Identity sweep: every buffered turn-terminal now carries the turn id,
          web client brought to parity.** A full audit of both halves found the output close was
          only one of six frame kinds `finish()` can buffer in `j.final` and redeliver on
          reconnect — `ask`, `turn_stopped`, `turn_failed`/`compress_failed`/`internal` errors,
          and the compress `say` carried no id at all (a redelivered ask re-rendered *and
          re-spoke* its questions). **Server:** all `finish()` frames are now stamped with the
          turn id (`stampTurn`; the compress mints its own), documented per-message in
          `docs/protocol.md`. **App (shared):** new `SessionSync.terminalSeen` — a check-and-record
          guard sharing the close registry (a turn ends in exactly one terminal) — wired into both
          controllers' ask/stopped/error/say handlers (idempotent state-clearing still runs;
          presentation and speech are dropped on a seen id). **Web parity:** `WebAppController` was
          still on the pre-turn-id text heuristics — wired to
          `noteChunk`/`closeSeen`/`closeStreamed`/`shouldSpeakClose`/`noteTurnStart` like Android;
          its `turn_failed` now clears the streamed/spoken turn state and the old-server digest
          probe error is swallowed (both Android parity). **Web data-loss fix:** the non-paging
          `history` branch replaced the whole in-memory log with the fetched page, so a backend
          with no readable transcript (Antigravity digests count=0, serves empty pages) wiped the
          only copy of the conversation on every reconnect — it now preserves out-of-page and
          live rows like the Android merge.
    - [x] 2026-07-19 — **Per-sink delivery accounting.** The job-wide `delivered` boolean is gone:
          `sessionJob` now holds a per-connection `pending` buffer (`jobs.go`). `deliver()` writes
          the final to every sink and records the failure against exactly the connection whose write
          failed, clearing only the ones that received it; an unreachable final becomes the `orphan`
          handed to just the next newly-bound conn (`bindJob`), and `flushPending` retries each
          buffer against its own connection. So a two-device attach no longer marks a reply delivered
          just because one device got it. Double-speak of a redelivered terminal is prevented by the
          per-turn `turnID` stamped on every terminal frame (client dedups on the id) rather than the
          proposed `replay: true` flag — same outcome. Shipped in `5f5f75f`.
    - [x] 2026-07-29 — **Stable history row ids.** Surfaced an optional durable `id` on the
          backend-neutral `session.Message`, populated from each backend transcript's stable id
          (Claude JSONL `uuid`, opencode `msg_…` `info.id`; Codex event lines + Antigravity expose
          none yet, so those rows keep the empty-id/index fallback). The gateway marshals `[]Message`
          directly so `id` auto-surfaces on the `history` wire row (documented in `docs/protocol.md`;
          enforced by the fieldsync drift test). `HistoryDigest` now keys each row on its durable id
          when present (falling back to index), so the digest is stable across a pure re-index and the
          app skips a needless refetch while a real content/count change still flips it. App:
          `HistMsg`/`ChatMessage`/`CachedMsg` gain `id` (defaulted, so pre-id disk caches still load),
          threaded through both controllers' history mapping; `SessionSync.dedupe` collapses by `id`
          FIRST — so a stale cached copy vs. a freshly re-indexed copy after clear/compress collapses
          instead of duplicating. Backward compatible both directions (old server → no id → index
          fallback). Tests: id-keyed digest survives re-index but flips on edit/id-swap; id-less rows
          stay index-keyed; Claude+opencode readers surface the id; dedupe id cases. `go test ./...` +
          wasmJs/Android compile + unit tests green. **Deployed 2026-07-29:** server bounced onto the
          new image (serving the id) and the phone APK installed. (Codex id landed below; Antigravity
          id is the remaining follow-up.)
    - [x] 2026-07-29 — **Codex durable per-row id.** Codex's `event_msg` agent_message lines carry
          the prose but no id; the durable `msg_…` id lives on the paired assistant `response_item`
          line (previously skipped). `codexFS.readTranscript` now decodes those lines too and pins
          each assistant id to its claude row by prose match, so Codex history rows reconcile across a
          re-index like Claude's. User/developer response_items carry no id (injected context, not
          clean prose), so user rows keep the index fallback the mixed-key `HistoryDigest` handles.
          Test fixture gained assistant response_items + id assertions; `go test ./...` green.
    - [x] 2026-07-29 — **Antigravity readable transcript.** Wired `antigravityFS`
          (`internal/session/antigravity_transcript.go`), consuming the per-turn brain ids we already
          capture in `Session.AgyBrainIDs`. Each brain's `transcript.jsonl` replays as one user row
          (unwrapped from agy's `<USER_REQUEST>` envelope; our scaffolding stripped downstream by the
          gateway's `stripInjected`) + one joined assistant row (`PLANNER_RESPONSE` steps ordered by
          `step_index`, rejoined with blank lines like `reconstructAgyReply` renders the live reply, so
          a replayed turn dedupes against its live copy). Durable brain-scoped ids (`<brain>:in` /
          `<brain>:resp`) survive re-index. agy exposes no token usage → context stays absent; delete
          is a no-op (brain dirs are agy's store); host/SSH only (sandbox-internal dirs invisible, the
          pre-existing reader limit). `nullTranscript` had no remaining caller → removed. Reader unit
          tests + a real-brain smoke check green; docs (architecture.md + README.md) no longer claim
          agy history is unavailable. `go test ./...` green.
  - [x] 2026-07-17 — **Audit** the other mutation messages (`renamed`, `session_list`, `detached`)
        for the same completeness so the app never has to infer a state change. Findings: the wire
        shapes of `renamed`/`detached`/`context_reset` were already complete; `session_list` has no
        client consumer (sidebar rides `discovered`, per drift-test exemption). Four gaps closed:
        (1) **server** — `renamed` was sent only to the initiator; now broadcast to **every**
        connection attached to the session (`gateway.broadcastRenamed`), so a rename on one device
        reflects on the other instead of being inferred from a later `discovered`. (2) **web** —
        `renamed` handler now `session.migrate`s the digest caches (was orphaning them). (3) **web**
        — `discovered` handler now re-derives the attached title by stable `session_id` and migrates
        name-keyed state on a cross-device rename, mirroring Android (closes the pre-existing
        "web `renamed`/`discovered` don't re-key digest keys / re-derive title" gap noted below).
        (4) **both clients** — a `set_agent` backend switch rotates the `session_id` but keeps the
        name and re-emits `attached` (not `context_reset`); the clients kept the wiped old backend's
        rows. New shared `SessionSync.onAttachRotation` drops the stale rows + digests on a same-name
        id change (guarded so a normal re-attach drops nothing) — a latent repeat of the original
        clear/compress duplicate-rows bug. Server `go test` green; both APK/wasm builds green.
        Still needs on-device confirmation of (4) via a live backend switch."""

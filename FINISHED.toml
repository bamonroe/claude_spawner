[[task]]
id = "allow-deleting-sessions-whose-host-is-unreachable"
title = "Allow deleting sessions whose host is unreachable"
description = "Deleting a session on a dead host effectively doesn't work: removeSession (gateway/ops_session.go:417) calls driver.DeleteSessionAll before dropping the registry record, and for a session on an unreachable host (e.g. bam on mom right now) that purge grinds through repeated 15s SSH dial timeouts, so the delete appears to hang and the user can't get rid of the session — the very session causing the sweep lag. The purge is already best-effort (an error still drops the record), so make the failure FAST and the cleanup durable: when the host is unreachable (fail fast via the SSH pool's negative dial cache once that lands), drop the registry record immediately and leave a tombstone (session/tombstone.go seam) recording the remote purge still owed, retried when the host is next reachable. Verify the tmuxMgr.ClaudeDirs guard doesn't also stall on remote hosts. Related: ssh-pool-negative-dial-cache-for-unreachable-hosts."

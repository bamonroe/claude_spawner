[[task]]
id = "rotating-the-phone-with-mic-lock-open-closes-the-mic-and-sends-the-message"
title = "Rotating the phone with mic lock open closes the mic and sends the message"
description = "When the device is rotated while the mic is locked open (lock-mic / hands-free capture), the orientation change appears to tear down and recreate the activity, which closes the mic and submits whatever has been captured so far as a message. Expected: an orientation change should leave a locked-open mic recording, with no send. Likely an activity-recreation issue on configuration change — the recorder/lock state isn't retained across it. Reported by the user on the Pixel 8a."
status = "active"
level = "scope"
category = "bug"
urgency = "normal"
order = 10
created = 2026-08-13
tags = ["android", "mic", "orientation"]

[[task]]
id = "give-session-store-a-change-notification-hook"
title = "Give session.Store a change-notification hook"
description = """
Audit result: every session-list mutation site (dialog.go voice spawn, browse.go picker spawn, ops_session.go kill/rename/model, ops_discover.go adopt/delete, ops_usage.go model change, turns.go/dictate.go per-turn Put) writes straight to session.Store with no notification. Nothing tells other connections the list changed, which is why the sidebar and radial menu are stale until a manual refresh.

Fix at the unifying interface rather than at each callsite: add an observer/subscription hook on session.Store that fires from inside Insert/Put/Delete/Rename/ForgetID, so any present or future mutation is covered by construction. The hook must carry enough to let subscribers filter no-op churn: Put is called on every turn (turns.go, dictate.go) and most of those writes do not change any list-visible field (name, dir, host, target, agent, model, profile, busy). Compare the previous record against the new one and only signal when a list-visible field actually differs, so the broadcast layer is not spammed once per turn. Keep it non-blocking (never hold the store lock while calling out) and unit-test that each mutation fires exactly once and that a no-op Put fires nothing."""
status = "active"
level = "task"
category = "refactor"
urgency = "high"
order = 30
created = 2026-08-13
tags = ["sessions", "server", "push"]

[[task]]
id = "broadcast-the-session-list-to-every-client-when-it-changes"
title = "Broadcast the session list to every client when it changes"
description = """
Depends on [give-session-store-a-change-notification-hook].

Today msgSessionList (ops_session.go:79) and msgDiscovered (ops_discover.go:110) are only ever c.send'd back to the connection that asked — there is no broadcast path for session state, unlike hosts.go which already broadcasts host_list to every client on change. The Kotlin side is already fully reactive: both the sidebar and the radial menu collect the same controller.discovered StateFlow (MainScreen.kt:126,208) and VoiceControllerMessages/WebAppControllerMessages assign _discovered.value straight from any incoming discovered frame, gated on nothing. So an unsolicited push already lands on both surfaces with no client change needed.

Work: subscribe the gateway to the store change hook at startup and broadcast a fresh discovered frame to every connected conn. Use the registered-rows path only — do not kick a disk walk per change; reuse the cached/last scan for the adoptable rows, or send partial:true, which the client already treats as do-not-prune. Coalesce bursts (a spawn touches the store more than once) behind a short debounce so one logical change is one frame. Then document it in docs/protocol.md: discovered is no longer response-only, it is also a server push emitted whenever the session list changes; note it may be partial. Verify a session spawned from one client appears in a second client's sidebar and radial menu with no refresh tap."""
status = "active"
level = "task"
category = "feature"
urgency = "high"
order = 40
created = 2026-08-13
tags = ["sessions", "server", "protocol", "push"]

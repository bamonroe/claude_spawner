[[task]]
id = "speech-gate-as-a-pipeline-front-door"
title = "Speech gate as a pipeline front door"
description = "Move the speech gate from a post-transcription text filter to the entry condition for the whole hands-free pipeline: while closed, score each clip for the gate phrase and retain nothing (no PCM buffer, no draft, no transcript bubble, no accurate pass); on open, capture behaves as today until the end token, then re-closes. Full scope, risks and open decisions in docs/scopes/speech-gate-front-door.md. Two decisions need the user: (1) whether 'hey buddy' commands also require the gate (proposed yes, with barge-in stop staying ungated), (2) a client-visible gate-closed indicator, since a missed gate now discards the audio with no transcript to show what was heard. Touches gateway/stream.go + conn.go, stream_test.go, and README/architecture docs."
status = "active"
category = "feature"
urgency = "normal"
order = 10
created = 2026-08-05
tags = ["speech", "gateway", "voice"]

[[task]]
id = "prioritize-foreground-history-over-transcript-prefetch"
title = "Prioritize foreground history over transcript prefetch"
description = """
The app's TranscriptPrefetcher (net/TranscriptPrefetcher.kt:86) runs up to 2 background history fetches for recently-active sessions, kicked by discovered pushes, landed replies, and turn end; the server allows 4 concurrent history reads per connection (ops_history.go:18) fanning SSH probes into the per-host channel budget (ssh_channels.go:46, 4 stream channels). A foreground refresh of the session the user is looking at can queue behind prefetch traffic, capped only by the 30s remote probe timeout. Scope a priority lane: either the server distinguishes foreground vs prefetch history requests (protocol flag) and schedules accordingly, or the client pauses the prefetcher while a foreground refresh or gap-fill is in flight. Related: reconnect gap-fill pages 30 rows per sequential round trip — consider a bigger gap-fill limit while at it.

Do NOT rebuild/recreate the server for this work: land the commits and background an image build only (see CLAUDE.md)."""
status = "active"
level = "scope"
category = "feature"
urgency = "low"
order = 80
created = 2026-08-08
tags = ["perf", "lag"]

[[task]]
id = "bound-the-discovery-cwd-walk-over-the-projects-dir"
title = "Bound the discovery cwd walk over the projects dir"
description = """
The discovery walk's cwds() (claudefs.go:338) reads a 64KiB head per unregistered transcript to recover each session's cwd; on the real projects dir (~286 files / ~560MB, cited at claudefs.go:309) that's a heavy sweep of SSH reads. It runs off the request path behind a 15s memo (attach_discover.go:26), so it's not user-blocking, but it still burns the shared per-host SSH channel budget while foreground work is running. Cache cwd per transcript id durably (it never changes for a given file), skip files whose size+mtime are unchanged, and consider batching the heads into fewer execs.

Do NOT rebuild/recreate the server for this work: land the commits and background an image build only (see CLAUDE.md)."""
status = "active"
level = "task"
category = "refactor"
urgency = "low"
order = 130
created = 2026-08-08
tags = ["perf"]

[[task]]
id = "per-part-digest-cacheability-so-one-unsignable-segment-does-not-poison-the-session"
title = "Per-part digest cacheability so one unsignable segment does not poison the session"
description = """
chainParts.ok (driver.go:795-804) is all-or-nothing: if any single archived segment or the current chain fails to sign, parts.ok goes false and the durable digest cache plus memo storage are disabled for the WHOLE session permanently (see DisplayDigest driver.go:646-668). Make cacheability per-part so a mixed-backend or partly-indescribable session keeps the benefit for the parts that do sign.

Do NOT rebuild/recreate the server for this work: land the commits and background an image build only (see CLAUDE.md)."""
status = "active"
level = "task"
category = "refactor"
urgency = "low"
order = 74
created = 2026-08-08
tags = ["history"]

[[task]]
id = "multi-connection-ssh-pool-n-clients-per-host-channels-handed-out-across-them"
title = "Multi-connection SSH pool: N clients per host, channels handed out across them"
description = "Parent scope: centralize-ssh-bindings. Keep SSHPool as the single seam but stop making one TCP connection the unit of concurrency. Split poolEntry (session/ssh_pool.go:48) so it holds a slice of conns — each {client *ssh.Client, chans channelBudget, lastUsed time.Time} — instead of one client + one budget. openChannel (ssh_channels.go:122) picks the least-loaded conn whose budget has a free slot, and dials an ADDITIONAL connection for that host when every existing one is saturated, up to a per-host cap; only when the cap is reached does a caller block on a slot as it does today. Per-conn dial still serializes under the entry lock and honours the negative dial cache. drop() must evict only the offending conn, not the host's whole entry — the point of the change is that one dead or busy connection can't punish the others. Keep the stream sub-budget per connection so turns still can't starve probes. Do NOT rebuild/recreate the server."
status = "active"
level = "task"
category = "refactor"
urgency = "normal"
order = 290
created = 2026-08-08
tags = ["ssh"]

[[task]]
id = "reap-idle-extra-ssh-connections-per-host"
title = "Reap idle extra SSH connections per host"
description = "Parent scope: centralize-ssh-bindings. Follow-on to the multi-connection pool: overflow connections opened during a burst (a digest sweep, a prefetch storm) must not linger forever. Close and remove any conn beyond the first that has had no channel in flight for an idle window, on a low-frequency sweep or lazily at openChannel time; the primary connection stays cached as today with its keepalive. Never close a conn holding a slot. Do NOT rebuild/recreate the server."
status = "active"
level = "task"
category = "refactor"
urgency = "normal"
order = 300
created = 2026-08-08
tags = ["ssh"]


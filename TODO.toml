[[task]]
id = "prioritize-foreground-history-over-transcript-prefetch"
title = "Prioritize foreground history over transcript prefetch"
description = """
The app's TranscriptPrefetcher (net/TranscriptPrefetcher.kt:86) runs up to 2 background history fetches for recently-active sessions, kicked by discovered pushes, landed replies, and turn end; the server allows 4 concurrent history reads per connection (ops_history.go:18) fanning SSH probes into the per-host channel budget (ssh_channels.go:46, 4 stream channels). A foreground refresh of the session the user is looking at can queue behind prefetch traffic, capped only by the 30s remote probe timeout. Scope a priority lane: either the server distinguishes foreground vs prefetch history requests (protocol flag) and schedules accordingly, or the client pauses the prefetcher while a foreground refresh or gap-fill is in flight. Related: reconnect gap-fill pages 30 rows per sequential round trip — consider a bigger gap-fill limit while at it.

Do NOT rebuild/recreate the server for this work: land the commits and background an image build only (see CLAUDE.md)."""
status = "active"
level = "scope"
category = "feature"
urgency = "low"
order = 80
created = 2026-08-08
tags = ["perf", "lag"]

[[task]]
id = "bound-the-discovery-cwd-walk-over-the-projects-dir"
title = "Bound the discovery cwd walk over the projects dir"
description = """
The discovery walk's cwds() (claudefs.go:338) reads a 64KiB head per unregistered transcript to recover each session's cwd; on the real projects dir (~286 files / ~560MB, cited at claudefs.go:309) that's a heavy sweep of SSH reads. It runs off the request path behind a 15s memo (attach_discover.go:26), so it's not user-blocking, but it still burns the shared per-host SSH channel budget while foreground work is running. Cache cwd per transcript id durably (it never changes for a given file), skip files whose size+mtime are unchanged, and consider batching the heads into fewer execs.

Do NOT rebuild/recreate the server for this work: land the commits and background an image build only (see CLAUDE.md)."""
status = "active"
level = "task"
category = "refactor"
urgency = "low"
order = 130
created = 2026-08-08
tags = ["perf"]

[[task]]
id = "make-the-ssh-per-host-connection-and-channel-caps-configurable"
title = "Make the SSH per-host connection and channel caps configurable"
description = "Parent scope: centralize-ssh-bindings. Expose the pool sizing as SPAWNER_SSH_MAX_CONNS (per-host connection cap) and SPAWNER_SSH_MAX_CHANNELS (per-connection channel budget) in internal/config, defaulting to today's values, and document both in docs/config.md — the internal/docsync drift test requires each var backticked there. Lets a host with a raised MaxSessions be tuned without a rebuild of the constants. Do NOT rebuild/recreate the server."
status = "active"
level = "task"

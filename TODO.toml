[[task]]
id = "per-session-record-locking"
title = "Per-session record locking"
description = """
(1.0 quality pass, deferred item). The store hands out
shared `*session.Session` pointers; a running turn's goroutine mutates the record
(Started/PendingSeed/primes + Put) while another device's read loop can mutate it too
(kill-job, set_agent/model, rename). The one-writer invariant covers turn-vs-turn and
reconcile, but not turn-vs-ops or two devices. Wants a deliberate design (per-record
mutex or store-mediated mutation), not a drive-by — scoped out of the 2026-07-13
concurrency fixes below.
- **Scoped 2026-07-30 (design ready; NOT implemented — deliberately deferred: this can't be
  live-verified, and a lock-ordering slip would deadlock the production server on next deploy, a
  worse failure than the current rare race).** Findings:
  - **`Store` (`store.go:15`) protects only the two index maps** (`byName`/`byID`); every getter
    (`Get`/`GetByDir`/`GetBySessionID`/`GetByAnyID`/`List`) returns the shared `*Session` directly
    under `RLock` and then drops the lock — so record *fields* are unsynchronized once the pointer
    escapes. `Session` (`session.go:25`) has no mutex.
  - **`Store.flush` (`store.go:262`) marshals the shared pointers under only the map RLock** — a
    concurrent field write (esp. a slice append: `PriorIDs`/`History`/`AgyBrainIDs`/`Jobs`) is a
    real data race against `json.Marshal` and can corrupt/crash the marshal, independent of the
    two-writer problem.
  - **Mutation sites** (~20): turn goroutine — `driver_turn.go:75/90/107/108/127`,
    `turns.go:101/118/122/130` (startTurn), `turns.go:232-238` (startCompress rotation);
    read-loop ops — `ops_session.go:311-317` (doClear, *isBusy-guarded*),
    `ops_discover.go:158-175` (set_agent/model, *isBusy guards only the backend-switch branch, not
    the model-only `rec.Model=` write*), `ops_usage.go:164` (doSetModel, **unguarded**),
    `bgjobs.go:243` (doKillJob, **unguarded**), `dictate.go:37`; off-loop tickers —
    `bgjobs.go:95-127` (reconcileJobs, isBusy-guarded), `bgnotify.go:165` (isBusy-guarded);
    `store.Rename` (`store.go:244`) is the one store-mediated field write.
  - **The three genuinely-unguarded turn-vs-ops races:** `doSetModel`, `doKillJob`, and the
    model-only path of `set_agent`. (A blunt `isBusy` guard on these is the wrong fix — it would
    e.g. block killing a runaway bg job while a turn runs; that UX nuance is why this is not a
    drive-by.)
  - **Recommended fix (lowest-churn complete path):** embed a `sync.Mutex` in `Session`; wrap
    each mutation (multi-field rotations as one critical section); make `flush` **snapshot each
    record's fields under that record's lock, then marshal the snapshots outside the lock** (so
    encode holds no record lock and can't deadlock a `Mutate→Put→flush` chain). Full read-side
    race-freedom additionally needs the gateway's `sess.Name`/`sess.SessionID` routing reads to
    lock too — the large half — so land it as: (a) mutex + flush-snapshot + wrap writers
    (closes the corruption/two-writer races), verified with `go test -race ./...`; then (b)
    audit read-side field access. Do it in a session where a live deploy can validate."""
status = "active"
category = "feature"
urgency = "normal"
order = 60
created = "2026-07-01"
tags = []

[[task]]
id = "dedicated-wake-word-end-token-detector-via-livekit-epic-proposed-2026-07-14"
title = "Dedicated wake-word / end-token detector via LiveKit (epic — proposed 2026-07-14)"
description = """
Replace Whisper-as-keyword-spotter with a purpose-built keyword-spotting model. Today all live
hands-free detection funnels through `gatedChunk` (`internal/gateway/stream.go`): each VAD clip is
fast-transcribed by the resident Whisper server and the wake word ("hey buddy") and end token are
found by **string-matching the transcript** — backed by a hand-curated list of Whisper mishearings
(`command.wakePhrases`) that also causes false triggers. That's the wrong tool: Whisper is a full
transcription model, and on the live deploy it's the **heavy `large-v3`** doing double duty (detection
on tiny clips + accurate transcription), which is both unreliable on short clips and wasteful.
**Decision — going with LiveKit (`livekit/livekit-wakeword`), not openWakeWord.** Both are Apache-2.0.
LiveKit replaces openWakeWord's simple classifier with a conv-attention model (claims ~100× fewer
false positives), ships a **native Rust runtime crate** (mel + embedding compiled into the binary,
loads only the small classifier `.onnx` at runtime — no Python), and a model we train ourselves on
synthetic Piper TTS data is commercially unrestricted (the CC-BY-NC restriction is only on
openWakeWord's *distributed* pre-trained models, not on self-trained weights or the Apache-2.0 Google
embedding backbone). Its flagship conv-attention ONNX is **not** openWakeWord-loadable (only its
fallback `dnn`→TFLite head is), so we commit to LiveKit's own runtime end-to-end rather than straddle.
Accurate full transcription on commit stays on Whisper, untouched."""
status = "active"
category = "feature"
urgency = "normal"
order = 70
created = "2026-07-14"
tags = ["dedicated-wake-word-end-token-detector-v", "epic"]

[[task]]
id = "positional-detection-correct-whisper-with-the-detector-proposed-2026-07-15"
title = "Positional detection → correct Whisper with the detector (proposed 2026-07-15)"
description = """
The
detector knows a token was said far more reliably than Whisper; use *where* it fired to stop
Whisper's mishearings from corrupting the parse. Enabling change: the sidecar returns the token's
**time offset** (the peak window's position — `predict_peak` already computes the argmax window,
just surface it) alongside the score, on both `/detect` and `/stream`. Then in `commitMessage`:
instead of string-searching the accurate transcript for the end token (which fails when Whisper
mishears "beep beep"), **trim the audio at the detected offset before the accurate pass** so
Whisper only ever transcribes the real command and can't mis-splice the token. Generalizes:
request word-level timestamps from Whisper, align them against the detector's high-confidence
token positions, and where they disagree **trust the detector** (force the token in/out at that
spot) — also covers mid-utterance wake tokens once the sidecar can report *all* above-threshold
window positions, not just the peak. Do this AFTER the base end-token gate is proven live (below),
so we're not stacking on an unverified layer."""
status = "active"
category = "feature"
urgency = "normal"
order = 80
created = "2026-07-15"
tags = ["dedicated-wake-word-end-token-detector-v"]


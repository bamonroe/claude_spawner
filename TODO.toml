[[task]]
id = "prioritize-foreground-history-over-transcript-prefetch"
title = "Prioritize foreground history over transcript prefetch"
description = """
The app's TranscriptPrefetcher (net/TranscriptPrefetcher.kt:86) runs up to 2 background history fetches for recently-active sessions, kicked by discovered pushes, landed replies, and turn end; the server allows 4 concurrent history reads per connection (ops_history.go:18) fanning SSH probes into the per-host channel budget (ssh_channels.go:46, 4 stream channels). A foreground refresh of the session the user is looking at can queue behind prefetch traffic, capped only by the 30s remote probe timeout. Scope a priority lane: either the server distinguishes foreground vs prefetch history requests (protocol flag) and schedules accordingly, or the client pauses the prefetcher while a foreground refresh or gap-fill is in flight. Related: reconnect gap-fill pages 30 rows per sequential round trip — consider a bigger gap-fill limit while at it.

Do NOT rebuild/recreate the server for this work: land the commits and background an image build only (see CLAUDE.md)."""
status = "active"
level = "scope"
category = "feature"
urgency = "low"
order = 80
created = 2026-08-08
tags = ["perf", "lag"]

[[task]]
id = "incremental-transcript-reads-for-opencode-codex-and-antigravity-backends"
title = "Incremental transcript reads for opencode, codex and antigravity backends"
description = """
Only the claude reader parses incrementally (extendParse/readFrom, transcript.go:377-467, sends just appended bytes via tail -c +N). opencode, codex and antigravity re-read everything on any miss — an opencode miss re-runs 'opencode export <id>' over SSH per id in the chain (opencode_transcript.go:56-60). Additionally, one indescribable archived segment flips chainParts.ok false (driver.go:766), making that session's digest and display memo PERMANENTLY uncacheable — every sweep and refresh does the full read forever. Two fixes at the reader seam: give the remaining backends an incremental (or at least memoized-by-sig per-id) read path, and make segment describability per-segment rather than all-or-nothing so one odd segment doesn't uncache the whole session. Related: the history-serve scope item covers the in-memory assembly side.

Do NOT rebuild/recreate the server for this work: land the commits and background an image build only (see CLAUDE.md)."""

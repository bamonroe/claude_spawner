id = "bound-the-discovery-cwd-walk-over-the-projects-dir"
title = "Bound the discovery cwd walk over the projects dir"
description = "The discovery walk's cwds() (claudefs.go:338) reads a 64KiB head per unregistered transcript to recover each session's cwd; on the real projects dir (~286 files / ~560MB, cited at claudefs.go:309) that's a heavy sweep of SSH reads. It runs off the request path behind a 15s memo (attach_discover.go:26), so it's not user-blocking, but it still burns the shared per-host SSH channel budget while foreground work is running. Cache cwd per transcript id durably (it never changes for a given file), skip files whose size+mtime are unchanged, and consider batching the heads into fewer execs."

[[task]]
id = "radial-palette-menu-composable-layout-animation-dismiss"
title = "Radial palette menu composable (layout, animation, dismiss)"
description = "Build the radial menu itself in commonMain so Android and the web client share it: a center button plus up to 8 slots around a ring. Layout math places slot 0 directly above center (most recent) and continues clockwise/right-handed for older entries; handle fewer than 8 entries gracefully. Includes open/close animation from the tap point, scrim, dismiss on outside tap/back, per-slot labels that fit, and touch targets sized for a thumb."
status = "active"
category = "feature"
urgency = "normal"
order = 40

[[task]]
id = "parallelize-broadcast-fan-out-one-wedged-device-must-not-stall-the-rest"
title = "Parallelize broadcast fan-out: one wedged device must not stall the rest"
description = "broadcastContextReset (gateway.go:424-437) — and the same shape in broadcast (:369), broadcastRenamed (:400), broadcastNotice (:449) — loops the connection snapshot serially ON THE CALLER'S GOROUTINE, doing c.send then c.doDiscover per connection. send takes that conn's write mutex with writeWait=10s (gateway.go:211), so one wedged or backgrounded device stalls the initiating device's confirmation (e.g. the 'cleared.' reply after doClear runs the whole fan-out on the initiator's read loop) for up to 10s per stuck socket. The recipients are independent: fan out one goroutine per connection — per-client frame ordering is preserved because each conn's frames still serialize under its own wmu. Also memoize the tmux list-panes fork (tmux/tmux.go:32-46) for ~1s: a single clear currently triggers one doDiscover — and thus one tmux fork — per connected device."

[[task]]
id = "multi-connection-ssh-pool-n-clients-per-host-channels-handed-out-across-them"
title = "Multi-connection SSH pool: N clients per host, channels handed out across them"
description = "Parent scope: centralize-ssh-bindings. Keep SSHPool as the single seam but stop making one TCP connection the unit of concurrency. Split poolEntry (session/ssh_pool.go:48) so it holds a slice of conns — each {client *ssh.Client, chans channelBudget, lastUsed time.Time} — instead of one client + one budget. openChannel (ssh_channels.go:122) picks the least-loaded conn whose budget has a free slot, and dials an ADDITIONAL connection for that host when every existing one is saturated, up to a per-host cap; only when the cap is reached does a caller block on a slot as it does today. Per-conn dial still serializes under the entry lock and honours the negative dial cache. drop() must evict only the offending conn, not the host's whole entry — the point of the change is that one dead or busy connection can't punish the others. Keep the stream sub-budget per connection so turns still can't starve probes. Do NOT rebuild/recreate the server."
status = "active"
level = "task"
category = "refactor"
urgency = "normal"

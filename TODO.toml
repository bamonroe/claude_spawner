[[task]]
id = "investigate-attach-switch-lag-and-inter-turn-latency"
title = "Investigate attach-switch lag and inter-turn latency"
description = """
FINDING (2026-08-04). Both symptoms have the same root cause: every read of a session's
"last context usage" and of its display history re-fetches and re-parses the WHOLE transcript
JSONL from the target host over SSH.

1. Attach switching is NOT a server round trip for the state change. focusKnownSession
   (WebAppControllerMessages.kt:38 / VoiceControllerMessages.kt:113) sets attached id/name/agent
   locally and immediately; the `attach` frame it then sends is silent:true. So the switch itself
   is local, as expected. What the user perceives as lag is the two things that follow:
     - `session.requestFreshHistory` -> server `history` -> serveHistory (ops_history.go:22) calls
       driver.ReadDisplayHistory UNCONDITIONALLY, even for the bodies-free `unchanged` fast path.
       That reads and JSON-parses the entire transcript chain.
     - the server's `attached` reply (ops_session.go:145/175) calls driver.LastContextUsage, which
       scans the whole transcript file just to pull one number.

2. Inter-turn dead time: turns.go:171 calls LastContextUsage at the END of every turn, in the
   critical path, right before the final `output` frame is emitted. The transcript has just grown,
   so the (size, mtime) parse cache is guaranteed cold — every turn pays a full re-read.

Cost of one such read, for a remote (SSH) session, per transcript in the chain:
     findByID  -> one SSH exec channel (`ls -1d ...`)
     stat      -> a second SSH exec channel
     open      -> a third, `cat` of the ENTIRE file into memory
   Measured on this host: ~/.claude/projects is 897 MB; the largest single transcripts are 26 MB /
   20 MB / 21 MB. The 26 MB file is only 475 lines (huge tool-result lines). Parsing it with the
   same per-line json.Unmarshal claudeFS uses costs ~175 ms warm and local; over SSH add the full
   26 MB transfer. And gateway handlers are dispatched SERIALLY off one inbound loop
   (gateway.go:494), so this blocks every other request on the connection.

REDUNDANT WORK, in order of payoff:
   a. lastUsageInFile (transcript.go:340) scans forward through the whole file to find the LAST
      usage-bearing assistant line. It only ever needs the tail.
   b. The parse cache is all-or-nothing on (size, mtime), but these JSONL files are APPEND-ONLY.
      Every turn invalidates the whole cached parse to append one turn's lines.
   c. findByID + stat + open are three separate SSH round trips for one file.
   d. serveHistory does the full read before checking have_hash, so the cache-validation fast path
      isn't a fast path on the server at all.

PROPOSED FIX, at the claudeFS seam (server/internal/session/claudefs.go) - not a band-aid at the
call sites:
   - Add a `tail(path, nbytes)` primitive alongside stat/open (local: ReadAt from the end; remote:
     `tail -c`). Reimplement lastContextUsage to scan backwards over a bounded tail, exactly the way
     cwdHeadBytes already bounds the cwd lookup at the head. This alone removes the per-turn cost in
     turns.go and most of the attach cost.
   - Make the transcript parse cache INCREMENTAL: key it on (path, mtime, size) as today, but on a
     size-only growth with the prefix unchanged, read just the appended byte range and extend the
     cached message slice. Append-only is the invariant that makes this correct, and it fixes
     history/digest as well as usage.
   - Collapse findByID+stat+open into one remote command per file (a single `stat`+`cat`, or resolve
     the path once and cache the id->path mapping per host - the mapping is stable).
   - In serveHistory, compute the digest via the cheap chainSig/DisplayDigest path first and answer
     `unchanged` before touching ReadDisplayHistory."""
status = "in-progress"
category = "refactor"
urgency = "critical"
order = 5
created = 2026-08-04
tags = ["performance", "latency", "ssh", "investigation"]

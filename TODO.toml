[[task]]
id = "natural-language-command-understanding-for-hey-buddy"
title = "Natural-language command understanding for 'hey buddy'"
description = """
Two layers can fail to understand speech, and the epic now tracks one scope for each.

TOKEN layer — whether the utterance is recognized as addressed to the assistant at all. The dedicated wake-word model path is abandoned: the trained LiveKit/ONNX detectors scored worse than the Whisper fallback, so Whisper transcript matching IS the detector. But token matching is still exact-word against a hand-maintained alias list, which produces both false negatives (an unlisted variant becomes dictation typed at Claude) and false positives (single-word aliases hijack a sentence mid-dictation). See the spoken-token scope.

COMMAND layer — whether a recognized utterance maps onto a registered Kind. Parse is a strict grammar over command.Registry; Unknown falls through to dictation when attached, or the 'didn't catch that' nudge when detached. Much of what this originally assumed was missing has since shipped — fuzzy project and shell-alias matching, per-segment path resolution, many phrasings per Kind — so the remaining work is an EVALUATION against the real miss corpus (56496a2 logs every unclassified wake-prefixed utterance), not a committed resolver build. See the evaluation scope; 'the deterministic pass is enough' is a valid outcome.

Standing constraint for both: command.Registry is the single source of truth, generated into docs/commands.json and the app, so anything built here derives from it and never becomes a second hand-written list. A give-up must stay free — fall through to dictation unchanged."""
status = "in-progress"
level = "epic"
category = "feature"
urgency = "normal"
order = 10
created = 2026-08-14
tags = ["voice", "commands", "epic"]

[[task]]
id = "scope-probe-one-shot-llm-intent-classification-latency-and-cost"
title = "Scope: evaluate the options for recovering unrecognized commands"
description = """
Folds in the former 'design the intent-resolver seam' and 'deterministic near-miss matching' scopes — this is an EVALUATION, not a commitment to build a resolver. Much of what those two assumed was missing already exists: projects.Levenshtein/FuzzyEqual back project-name and shell-alias matching, the spawn dialog fuzzy-resolves each path segment against the real filesystem over SSH, and Parse already accepts many phrasings per Kind. So the question is what MEASURABLY remains unrecovered, and whether anything beyond a wider deterministic pass earns its latency.

Answer, with numbers rather than design: (1) What does the real miss corpus contain? 56496a2 logs every wake-prefixed utterance Parse returns Unknown on, via gateway.runCommand. Read that log before proposing anything and classify the misses — inflected verb, filler word, homophone, stray article, or genuinely novel phrasing. If most are near-misses, deterministic matching over command.Registry aliases wins outright and no model call is justified. (2) How much does a cheap normalization plus edit-distance pass over the Registry recover on that corpus, and does it stay clear of real dictation ('list the files in this module' must flow through untouched)? Build the test table from the logged corpus, not from invented examples. (3) Only if a residue survives: probe one-shot classification latency against internal/agent's existing backends (haiku via claude -p, a small local ollama model), measured from both the host and the sandbox, and decide whether the round-trip fits inside the voice loop at all. (4) If something IS worth building, note where it must sit — both dispatch and the hands-free commitMessage path funnel through runCommand, so the fallback has one natural home — plus the give-up path (dictate the original text unchanged when attached, so a false negative costs nothing), the confirmation policy for destructive kinds, and the ordering versus the shell token and scratch mode.

Produce tasks only for what the corpus justifies. 'The deterministic pass is enough, drop the resolver' is a valid and likely outcome."""
status = "active"
level = "scope"
category = "feature"
urgency = "normal"
order = 30
created = 2026-08-14
tags = ["voice", "commands"]

[[task]]
id = "scope-better-handling-of-spoken-token-false-positives-and-negatives"
title = "Scope: better handling of spoken-token false positives and negatives"
description = """
The dedicated wake-word model path is a dead end — the LiveKit/ONNX detectors the user trained scored worse than the Whisper fallback, so Whisper transcript matching is the real detector and should be treated as such. But spoken-token matching (wake, end, speak) is still EXACT: command.phraseAt compares lowercased, punctuation-trimmed words against the catalogue's phrase set, so recognition is only as good as the hand-maintained alias list in spoken.Token. That produces both failure modes. False negatives: Whisper emits a variant nobody listed ('hey buddha', 'hey bunny', a swallowed 'hey') and the utterance silently becomes dictation typed at Claude, or a 'didn't catch that' when detached. False positives: the small single-word alias set ('everybody', 'heybuddy') is ordinary English, so mid-dictation words strip a wake and hijack a sentence; the end token can commit a turn early the same way.

Note the asymmetry to fix at the seam: the rest of the system already matches spoken input fuzzily — projects.Levenshtein/FuzzyEqual back project-name matching and session/shellresolve alias matching, and the spawn dialog fuzzy-resolves each path segment against the real filesystem. Only the token layer is strict. The candidate deep fix is to make phrasesAt itself score a phrase match (edit distance and/or a phonetic key, over the whole phrase not per word) with a confidence value, so every token type inherits tolerance from one place instead of growing alias lists.

Investigate and produce concrete tasks for: (1) what the miss corpus actually looks like — 56496a2 logs wake-prefixed utterances the grammar couldn't classify, but a MISSED wake is logged nowhere, so the false-negative side has no data; scope a way to capture near-wake transcripts without recording ordinary dictation. (2) Whether scoring belongs in phrasesAt with a per-token threshold on spoken.Token (which has a Model field but no threshold), and how the threshold differs for a two-word wake versus a single-word alias. (3) Whether Whisper's own signals (segment confidence/logprob, the vocabBias initial prompt) can gate a marginal match instead of a bare string distance. (4) The asymmetric cost policy: a false positive mid-dictation is loud and destructive, a false negative is merely annoying, so the wake token can afford to be looser than the end token — decide per token type. (5) Whether a marginal match should ask ('did you mean hey buddy?') rather than silently deciding."""
status = "active"
level = "scope"
category = "feature"
urgency = "normal"
order = 20
created = 2026-08-16
tags = ["voice", "stt"]

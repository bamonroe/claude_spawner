title = "One-off cleanup: purge leftover /usage probe transcripts under ~/.claude/projects/-home-bam"
description = "Every /usage probe since the reaper broke left a transcript in /home/bam/.claude/projects/-home-bam (cwd is driver.UsageDir = $HOME, set in server/main.go:109), which discovery re-surfaces as the phantom \"bam\" session named after the dir basename. Five files as of 2026-08-13. After the sh -c fix lands, delete the leftovers on the host (they are pure /usage probe garbage - each holds one \"/usage\" queue-operation and nothing else; verify that before removing) and confirm the \"bam\" row stays gone across a discover sweep. Consider also whether UsageDir should be $HOME at all: any probe leak there is guaranteed to look like a real session. A dedicated dir outside the scan roots would make the phantom impossible rather than merely reaped."
status = "active"
level = "task"
category = "chore"
urgency = "normal"
order = 40

[[task]]
id = "single-flight-guard-for-in-progress-logins"
title = "Single-flight guard for in-progress logins"
description = "Each 'claude auth login' invocation mints a fresh code_challenge/state, so its URL is bound to that process and starting a second login silently invalidates the first. Guard one live login per host+identity: a second start either returns the existing pending login (with its already-issued URL) or explicitly cancels and replaces it, never leaving two racing. Clean up the process on client disconnect so a killed app does not strand a PTY."
status = "active"
level = "task"
category = "feature"
urgency = "normal"
order = 100
created = 2026-08-10
tags = ["auth", "session"]


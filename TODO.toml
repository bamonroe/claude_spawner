[[task]]
id = "ssh-pool-negative-dial-cache-for-unreachable-hosts"
title = "SSH pool: negative dial cache for unreachable hosts"
description = "Host 'mom' (100.64.0.13) is currently unreachable, and every SSH operation to it pays a fresh 15s dial timeout (sshDialTimeout, server/internal/session/ssh_config.go:20), serialized on the per-host entry lock (ssh_pool.go:49). There is no negative caching: client() (ssh_pool.go:148) re-dials on every call after a failure. Live evidence: every digest sweep in the last 24h took 90-160s (docker logs 'digest sweep: 14 session(s) ... in 1m39s'), and three stacked sweeps completed exactly 15s apart — the dial-timeout signature. Fix at the pool seam (the unifying interface): after a failed dial, record the failure in the poolEntry and fail fast for a backoff window (e.g. 30-60s with exponential backoff, reset on success), so every caller — digest sweep, chainSig, context usage, turns — degrades to milliseconds against a dead host instead of minutes. Expose the host-down state so callers/logs can name the host instead of silently timing out."
status = "active"
level = "task"
category = "bug"
urgency = "high"
order = 10
created = 2026-08-08
tags = ["perf", "lag"]

[[task]]
id = "don-t-block-the-end-of-turn-output-frame-on-sessioncontextusage"
title = "Don't block the end-of-turn output frame on SessionContextUsage"
description = "gateway/turns.go:167 (and bgnotify.go:179) call driver.SessionContextUsage(sess) BEFORE j.finish(msgOutput(...)) sends the reply. This is a guaranteed cache miss by construction — the turn just appended to the transcript so the chain sig changed — and the miss costs serial SSH stat execs per transcript id plus a tail -c read of up to 32MB (transcript.go:536-544), all in the critical path of every reply the user is waiting to hear. Ship the output frame immediately using the turn's own usage for the badge, then compute the true context usage async and push a follow-up usage frame (the protocol already has per-session usage updates). This is the most direct cause of 'lag between turns'."
status = "active"
level = "task"
category = "bug"
urgency = "high"
order = 20
created = 2026-08-08
tags = ["perf", "lag"]

[[task]]
id = "batch-chainsig-stats-into-one-ssh-exec-per-host"
title = "Batch chainSig stats into one SSH exec per host"
description = "A freshness check is currently N serial SSH round trips: statChainSig (claudefs.go:613) loops the id chain calling fs.stat, one 'sh -c stat' exec per transcript file (claudefs.go:224-246), and displayChainParts (driver.go:760) repeats that for every archived segment plus the current chain. A session cleared/compressed many times has a long chain, so a single 'is my history current?' check fans out many round trips; the 1.5s sig memo (driver.go:722) only collapses one tap's burst. Batch it: one 'stat -c \"%s %Y\" a b c...' exec per host for the whole chain (all segments included), so a freshness check is one round trip. This multiplies through everything: digest sweep, history serve, context usage."
status = "active"
level = "task"
category = "refactor"
urgency = "normal"
order = 30
created = 2026-08-08
tags = ["perf", "lag"]

[[task]]
id = "digest-sweep-per-session-deadline-and-partial-results"
title = "Digest sweep: per-session deadline and partial results"
description = "serveDigests (gateway/ops_history.go:205) holds the entire digests frame until every session answers, so one slow/dead host delays the app's connect-time cache validation — and therefore its history refresh — by minutes. Even with the SSH negative dial cache in place, a generally slow host shouldn't gate all the others. Give each session's DisplayDigest a deadline (context timeout threaded through the driver/reader seam, not a wrapper) and send the frame with the sessions that answered; a session that missed the deadline is simply omitted, which the app already treats as 'keep the cached transcript'. Depends-on/related: ssh-pool-negative-dial-cache-for-unreachable-hosts."
status = "active"
level = "task"
category = "feature"
urgency = "normal"
order = 40
created = 2026-08-08
tags = ["perf", "lag"]

[[task]]
id = "move-digest-usage-cache-file-rewrites-off-the-lock"
title = "Move digest/usage cache file rewrites off the lock"
description = "usagecache.go:86-110 and digestcache.go:82-104: every Put marshals the ENTIRE entries map and does a CreateTemp+write+rename while holding the mutex. The 8-way digest sweep serializes behind N whole-file rewrites, and every turn end pays one on the critical-ish path. Restructure so Get/Put contend only on the in-memory map and persistence is a debounced/coalesced async flush (marshal a snapshot outside the lock); crash-loss of a few recent digests is fine since they recompute. Keep the invariant at the cache interface, not with an ad-hoc goroutine per Put."
status = "active"
level = "task"
category = "refactor"
urgency = "normal"
order = 50
created = 2026-08-08
tags = ["perf"]

[[task]]
id = "tame-the-autocompress-ticker-s-ssh-stat-storm"
title = "Tame the autocompress ticker's SSH stat storm"
description = "autoCompressLoop (gateway/autocompress.go:72-120) ticks every 5s and SEQUENTIALLY calls SessionContextUsage for every session in the store; each is a chainSig stat walk over SSH, and the 1.5s sig memo never survives to the next tick, so nothing caches. When warm/auto compress is enabled this is a continuous stream of serialized SSH round trips drawing from the same per-host channel budget (ssh_channels.go) the live turn stream and history reads need — and with an unreachable host in the store, each tick also eats dial timeouts. Scope the fix: candidates are (a) event-driven — only re-check a session after ITS turn completes, since context only grows on turns; (b) reuse the turn's own reported usage instead of re-statting; (c) a much longer tick with a sig-memo TTL that covers it. Decide which invariant the loop actually needs, then add the concrete task(s)."
status = "active"
level = "scope"
category = "bug"
urgency = "normal"
order = 60
created = 2026-08-08
tags = ["perf", "lag"]

[[task]]
id = "history-serve-stop-re-assembling-and-double-copying-the-whole-log-per-refresh"
title = "History serve: stop re-assembling and double-copying the whole log per refresh"
description = "Every turn invalidates the whole-log display memo (keyed on the full chain sig, displaymemo.go:51), so the post-turn refresh re-concats all segments, re-indexes every message (driver.go:792-828), and copies the full slice twice (displaymemo.go:61,70) — O(total messages) work to serve a 30-row page after appending one message. The transcript BYTES are already incremental (extendParse/tail -c +N, transcript.go:377-467); the in-memory assembly is not. Also the have_hash fast path (ops_history.go:123) structurally never hits right after a turn. Scope an incremental path: extend the memoized whole-log in place when only the current chain grew, and/or serve the top page without materializing the whole chain. Also note opencode/codex/antigravity have no incremental parse at all (a miss re-runs 'opencode export' per id over SSH), and one indescribable archived segment makes a session's digest permanently uncacheable (driver.go:766). Produce concrete tasks."
status = "active"
level = "scope"
category = "refactor"
urgency = "normal"
order = 70
created = 2026-08-08
tags = ["perf", "lag"]

[[task]]
id = "prioritize-foreground-history-over-transcript-prefetch"
title = "Prioritize foreground history over transcript prefetch"
description = "The app's TranscriptPrefetcher (net/TranscriptPrefetcher.kt:86) runs up to 2 background history fetches for recently-active sessions, kicked by discovered pushes, landed replies, and turn end; the server allows 4 concurrent history reads per connection (ops_history.go:18) fanning SSH probes into the per-host channel budget (ssh_channels.go:46, 4 stream channels). A foreground refresh of the session the user is looking at can queue behind prefetch traffic, capped only by the 30s remote probe timeout. Scope a priority lane: either the server distinguishes foreground vs prefetch history requests (protocol flag) and schedules accordingly, or the client pauses the prefetcher while a foreground refresh or gap-fill is in flight. Related: reconnect gap-fill pages 30 rows per sequential round trip — consider a bigger gap-fill limit while at it."
status = "active"
level = "scope"
category = "feature"
urgency = "low"
order = 80
created = 2026-08-08

[[task]]
id = "attach-must-not-block-the-inbound-loop-on-a-context-usage-ssh-read"
title = "Attach must not block the inbound loop on a context-usage SSH read"
description = "The attach handler runs inline on the connection's one-message-at-a-time inbound loop, and msgAttached embeds driver.SessionContextUsage (gateway/ops_session.go:176, :192, :227) — a chainSig SSH stat walk plus up to a 32MB tail read on a miss. While that runs, every other inbound message from that device (dictation, history requests, taps) queues behind it. Send the attached frame immediately without the usage badge (or with the cached value), then compute usage async and push the existing usage-update frame — same shape as the end-of-turn fix (see don-t-block-the-end-of-turn-output-frame-on-sessioncontextusage). Audit the dispatch table (gateway.go:540+) for any other handler that does SSH work inline on the loop; history/digest/discover already moved off it, attach didn't."

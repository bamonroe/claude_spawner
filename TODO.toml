schema_version = 1

[meta]
title = "TODO"
kind = "todo"
purpose = "The live task list for claude_spawner — open work only."
documentation_map = "CLAUDE.md"
archive = "FINISHED.toml"

[meta.rules]
add_proposed_work = "Add proposed features and tests as new tasks rather than losing them."
remove_dropped_items = "Remove dropped items with a one-line why (`scripts/todo.sh remove <id> --reason`)."
finish_work = "When a task is fully finished (built, tested, documented), run `scripts/todo.sh done <id>` to move it to FINISHED.toml — in the same commit that completes the work."
scope = "Both halves of claude_spawner live here: the Go server and the Kotlin/KMP app + web client. The historical phase roadmap stays in README.md."

[[task]]
id = "move-bindjob-reconcilejobs-off-the-gateway-read-loop"
title = "Move bindJob/reconcileJobs off the gateway read loop"
description = "doAttach ends with bindJob -> reconcileJobs (turns.go:324-334, bgjobs.go:41-65, session/bgjobs.go:112-127): re-uploads the 12KB spawner-job.sh heredoc and runs 'spawner-job list --json' on the target, on the connection's serial read loop (loop.go:33), under an 8s timeout. The follow-up history request queues behind it — 20-80ms local, 150-600ms over SSH, up to 8s on a slow target, and a hung target stalls the whole connection. Run it in a goroutine like startDigestSweep, and skip the re-stage when the script is already current."
status = "active"
category = "bug"
urgency = "high"
order = 20
created = 2026-08-05
tags = ["session-switch", "perf", "server"]

[[task]]
id = "snap-chat-scroll-on-session-switch-instead-of-animating"
title = "Snap chat scroll on session switch instead of animating"
description = "ChatRendering.kt:84-90: LaunchedEffect(last)/LaunchedEffect(scrollTick) call animateScrollToItem on a LazyColumn still holding the previous session's scroll offset, over an unmeasured list — and it fires up to three times per switch (showLog at focus, showLog in onAttached, onHistory). Visible 200-600ms of wrong-position-then-scroll motion; this is likely the main thing that makes switching feel non-instant. Use scrollToItem (snap) when the session id changes; keep the animation only for new messages within a session."
status = "active"
category = "bug"
urgency = "high"
order = 30
created = 2026-08-05
tags = ["session-switch", "perf", "android"]

[[task]]
id = "move-transcript-cache-disk-i-o-off-the-main-thread"
title = "Move transcript cache disk I/O off the main thread"
description = "showLog (VoiceControllerMessages.kt:367-374) runs persist() (synchronous JSON encode + file write of up to 2000 messages, :76-92) and ensureLoaded() (file read + decode + dedupe, :62-72) directly in the Compose click lambda, blocking the frame and delaying the drawer-close animation by 30-200ms+ per switch. onHistory also persists synchronously (:377-425). Move TranscriptCache reads/writes to a background dispatcher; publish from memory immediately."
status = "active"
category = "refactor"
urgency = "high"
order = 40
created = 2026-08-05
tags = ["session-switch", "perf", "android"]

[[task]]
id = "serve-history-pages-without-full-transcript-re-parse-on-digest-miss"
title = "Serve history pages without full transcript re-parse on digest miss"
description = "ops_history.go:16-63: any session that produced output since last fetch misses have_hash, and ReadDisplayHistory (driver.go:513-533, transcript.go:481-505) parses the entire transcript chain plus archived backend segments just to return the newest 30 messages — hundreds of ms to seconds, worse over SSH (ls glob + stat + read per id). Serve the tail incrementally (e.g. parse backward from the end, or cache parsed pages keyed by digest)."
status = "active"
category = "refactor"
urgency = "normal"
order = 50
created = 2026-08-05
tags = ["session-switch", "perf", "server"]

[[task]]
id = "make-attach-s-lastcontextusage-read-non-blocking"
title = "Make attach's LastContextUsage read non-blocking"
description = "ops_session.go:175: msgAttached computes LastContextUsage via a blocking backward tail read (256KB escalating to 4MB/32MB, transcript.go:519-526) before the attached frame is written — ~5-30ms local, 50-150ms remote — delaying the attached ack that gates the client. Send attached immediately and follow with usage asynchronously, or cache last usage per session."
status = "active"
category = "refactor"
urgency = "normal"
order = 60

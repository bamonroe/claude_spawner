# TODO — active task list for this project.
#
# Single source of truth for active work (see CLAUDE.md -> documentation map).
# Edit through the todo skill so ids, ordering, and metadata stay consistent:
#   scripts/todo.sh <command>      (see .claude/skills/todo/SKILL.md)
# Hand-editing works too — it is plain TOML — but the skill keeps it tidy.

schema_version = 1

[meta]
title = "TODO"
kind = "todo"
purpose = "The live task list for claude_spawner — open work only."
documentation_map = "CLAUDE.md"
archive = "FINISHED.toml"

[meta.rules]
add_proposed_work = "Add proposed features and tests as new tasks rather than losing them."
remove_dropped_items = "Remove dropped items with a one-line why (`scripts/todo.sh remove <id> --reason`)."
finish_work = "When a task is fully finished (built, tested, documented), run `scripts/todo.sh done <id>` to move it to FINISHED.toml — in the same commit that completes the work."
scope = "Both halves of claude_spawner live here: the Go server and the Kotlin/KMP app + web client. The historical phase roadmap stays in README.md."

[[task]]
id = "polish-efficiency-epic"
title = "Polish and efficiency pass: fix UX lags and creeping bugs"
description = "Umbrella epic for making the existing app pleasant, not for adding features. The Android APK (web client untested for ~a week) has accumulated polishy lag and small bugs: session switching is still laggy; the local transcript cache reads first but should be proactively refreshed from the server in the background; under server load, session names go missing and the app has spawned a duplicate session named after the directory (e.g. a new 'claude_spawner' session appearing alongside the existing 'spawner' session while rapidly swapping sessions, with no spawn requested). Work this epic by scoping concrete problem areas into child scope/task items and shipping them incrementally. Explicitly out of scope: any new feature."
status = "active"
level = "epic"
category = "bug"
urgency = "high"
order = 10
created = 2026-08-07
tags = ["polish", "performance"]

[[task]]
id = "prewarm-transcript-cache"
title = "Pre-warm the transcript cache into memory at app startup"
description = "Child of [polish-efficiency-epic] via [scope-session-switch-lag]. TranscriptCache.mem starts empty each launch, so the first switch to any session renders an empty chat until the disk read + JSON decode land (ensureLoaded in VoiceControllerMessages.kt:72-81) — the dominant switch lag. On controller init, launch an IO job that lists the cache dir and decodes the most recently modified entries into mem so peek hits on first switch. Add a bounded LRU on mem so the warm set stays capped; load still serves evicted entries."
status = "active"
level = "task"
category = "bug"
urgency = "high"
order = 40
created = 2026-08-07
tags = ["polish", "performance"]

[[task]]
id = "switch-ui-thread-work"
title = "Take dedupe/persist off the session-switch UI thread; collapse switch state writes"
description = "Child of [polish-efficiency-epic] via [scope-session-switch-lag]. showLog (VoiceControllerMessages.kt:434) runs persist(previousId) with a dedupe over up to 2000 rows on the main thread, and applyCached re-dedupes already-deduped cached rows. Defer persist to a background coroutine (the memory map is authoritative), drop the redundant dedupe in applyCached, and collapse the ~8 separate StateFlow writes in focusKnownSession (:121-132) into one attached-session state object so a switch causes one recomposition instead of eight."
status = "active"
level = "task"
category = "bug"
urgency = "high"
order = 50
created = 2026-08-07
tags = ["polish", "performance"]

[[task]]
id = "transcript-prefetcher"
title = "Background transcript prefetcher for non-focused sessions"
description = "Child of [polish-efficiency-epic] via [scope-session-switch-lag]. Add a TranscriptPrefetcher in commonMain next to SessionSync that, on discovered updates and when idle, issues history{have_hash} requests for the top-N most recently active non-focused sessions (throttled, <=2 in flight, paused while a turn streams), merging replies through the existing onHistory path so the local cache lands warm and current before the user taps. It must only touch router.logs and the disk cache — never router.currentId or _chat for non-viewed sessions."
status = "active"
level = "task"
category = "feature"
urgency = "high"
order = 60
created = 2026-08-07
tags = ["polish", "performance"]

[[task]]
id = "use-digest-sweep"
title = "Use the server digest sweep to prioritize prefetch instead of discarding it"
description = "Child of [polish-efficiency-epic] via [scope-session-switch-lag]. The server already pushes a digest sweep on connect but the client throws it away (VoiceControllerMessages.kt:210-215, 'protocol no-op'). Replace that branch with a recordServerDigest sink and have the prefetcher fetch only sessions whose server hash differs from the locally held hash, newest-active first. Keep the per-attach have_hash round trip as the authoritative staleness check; digests are for prioritization only."
status = "active"
level = "task"
category = "refactor"
urgency = "normal"
order = 70
created = 2026-08-07
tags = ["polish", "performance"]

[[task]]
id = "history-off-inbound-loop"
title = "Serve history/digest off the gateway connection's serial inbound loop"
description = "Child of [polish-efficiency-epic] via [scope-session-switch-lag]. Inbound messages dispatch serially per connection (gateway/conn.go:34), so on a switch the history request queues behind attach's transcript stats, and any concurrent discover/browse/turn blocks both. Run serveHistory (gateway/ops_history.go) in a goroutine with a small per-connection semaphore and per-session in-flight coalescing so prefetch bursts can't stampede; sends already serialize through wmu so write ordering stays safe."
status = "active"
level = "task"
category = "bug"
urgency = "high"
order = 80
created = 2026-08-07
tags = ["polish", "performance"]

[[task]]
id = "memoize-chain-stats"
title = "Memoize chain stats so attach+history don't double-stat the transcript chain"
description = "Child of [polish-efficiency-epic] via [scope-session-switch-lag]. On every switch, attach's SessionContextUsage (session/driver.go:706) and history's DisplayDigest (driver.go:519) each stat the entire transcript chain within milliseconds of each other — for SSH-hosted sessions that's a network round trip per file, twice. Add a short-TTL (~1-2s) per-session chainParts memo in the driver so the second call reuses the first's signature."
status = "active"
level = "task"
category = "bug"
urgency = "normal"
order = 90
created = 2026-08-07
tags = ["polish", "performance"]

[[task]]
id = "register-discovered-ownsid-guard"
title = "registerDiscovered must refuse ids an existing session already owns"
description = "Child of [polish-efficiency-epic] via [scope-phantom-duplicate-sessions]. registerDiscovered (dialog.go:384) checks only GetBySessionID before minting a new dir-named record, so a retired PriorID transcript found on disk becomes a brand-new session named after the directory. Before minting, scan the store for any record where OwnsID(sessionID) is true and return that record instead; guarantee a discovered id whose chain belongs to a registered session can never produce a second row. Same fix covers the resolveSession fuzzy voice-attach path (ops_session.go:240-263)."
status = "active"
level = "task"
category = "bug"
urgency = "critical"
order = 110
created = 2026-08-07
tags = ["reliability"]

[[task]]
id = "no-implicit-adopt"
title = "Never implicitly adopt on attach-by-id miss — fail loudly instead"
description = "Child of [polish-efficiency-epic] via [scope-phantom-duplicate-sessions]. Drop the adoptDiscoveredID fallback from doAttachBy (ops_session.go:104-109); an unresolvable id answers attach_failed{reason:unknown_session} and nothing else. Adoption stays an explicit user action (adopt, rename_discovered, discover sheet). Log the miss with id, dir, and whether a transcript exists so this bug class is diagnosable, not silent."
status = "active"
level = "task"
